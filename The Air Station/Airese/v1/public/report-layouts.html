<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Airese v1 · Layout options (temporary)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" />
<style>
  /* Temporary page. The frame is the same as public/iphone.html. */
  :root { --page: #0A0D16; --ink: #F2F3F5; --frame: #2B3140; --frame-edge: #4A5266; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--page); color: var(--ink); font-family: Montserrat, system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 20px; flex: none; transform-origin: center center; }
  /* Ordinary, Moderate, Severe: one phone at a time */
  .tabs { display: flex; gap: 4px; width: 426px; padding: 4px; border-radius: 999px; background: #141A28; }
  .tabs button { flex: 1; min-height: 44px; border: 0; border-radius: 999px; background: none; color: var(--ink); cursor: pointer; font: 600 14px Montserrat, system-ui, sans-serif; }
  .tabs button:hover { background: #2A3244; }
  .tabs button[aria-pressed="true"] { background: #A1B5F5; color: #0B1020; }
  .tabs button:focus-visible { outline: 2px solid #A1B5F5; outline-offset: 2px; }

  /* iPhone 17 Pro: 402 × 874 pt screen */
  .phone { position: relative; width: 426px; height: 898px; border-radius: 68px; padding: 12px;
    background: linear-gradient(145deg, var(--frame-edge), var(--frame) 30%, var(--frame) 70%, var(--frame-edge));
    box-shadow: 0 0 0 1.5px #1a1e28, 0 30px 80px rgba(10,14,30,.35), inset 0 0 0 2px rgba(255,255,255,.08); }
  .screen { position: relative; width: 402px; height: 874px; border-radius: 56px; overflow: hidden; background: #000; isolation: isolate; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; visibility: hidden; }
  iframe.on { visibility: visible; }
  .statusbar { position: absolute; z-index: 10; top: 0; left: 0; right: 0; height: 62px; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 52px; font: 600 17px/1 -apple-system, "SF Pro Text", system-ui, sans-serif; color: #fff; }
  .statusbar .icons { display: flex; gap: 7px; align-items: center; }
  .island { position: absolute; z-index: 11; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 20px; background: #000; }
  .home { position: absolute; z-index: 10; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: #fff; pointer-events: none; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="tabs" id="tabs" role="group" aria-label="Kind of night"></div>
  <div class="phone">
    <div class="screen" id="screen"><div class="statusbar"><span>9:41</span><span class="icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .6 10.2 10.2 0 0 0 .9 3.4L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.3c1.4 0 2.7.5 3.7 1.4l1.1-1.2A7 7 0 0 0 8 3.9a7 7 0 0 0-4.8 1.8l1.1 1.2c1-.9 2.3-1.4 3.7-1.4Zm0 3.3c.6 0 1.1.2 1.5.5L8 11 6.5 9.3c.4-.3.9-.5 1.5-.5Z"/></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity=".5"/></svg></span></div><div class="island"></div><div class="home"></div></div>
  </div>
</main>
<script>
  // Layout Option 2 by default; ?layout=wide is Layout Option 3, ?layout=loud is Layout Option 4, ?layout=mellow is Layout Option 5 (src/components/ReportTrio.tsx)
  var layout = new URLSearchParams(location.search).get('layout') || 'trio';
  var tabs = document.getElementById('tabs'), screen = document.getElementById('screen');
  var shown = {};
  // All three load up front, so switching is instant. The chosen night stays when moving between layouts, to compare like with like.
  function show(key) {
    Object.keys(shown).forEach(function (k) {
      shown[k].button.setAttribute('aria-pressed', k === key);
      shown[k].app.classList.toggle('on', k === key);
    });
    try { shown[key].app.contentWindow.dispatchEvent(new CustomEvent('airese:replay')); } catch (err) {} // Layout Option 5's arrival, now it can be seen
    try { sessionStorage.setItem('airese:layout-night', key); } catch (err) {}
  }
  [['Ordinary', 'ordinary'], ['Moderate', 'moderate'], ['Severe', 'severe']].forEach(function (night) {
    var button = document.createElement('button'), app = document.createElement('iframe');
    button.type = 'button'; button.textContent = night[0];
    button.addEventListener('click', function () { show(night[1]); });
    app.title = night[0] + ' night report';
    app.src = '/reports?state=' + night[1] + '&layout=' + layout + '&frame=iphone';
    tabs.appendChild(button); screen.appendChild(app);
    shown[night[1]] = { button: button, app: app };
  });
  var saved = null;
  try { saved = sessionStorage.getItem('airese:layout-night'); } catch (err) {}
  show(shown[saved] ? saved : 'ordinary');
  function fit() {
    var s = Math.min(1, (innerHeight - 24) / 966, (innerWidth - 24) / 426); // the tabs and the phone
    document.getElementById('stage').style.transform = 'scale(' + s + ')';
  }
  fit(); addEventListener('resize', fit);
</script>
</body>
</html>
