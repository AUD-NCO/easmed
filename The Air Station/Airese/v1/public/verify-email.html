<!doctype html>
<!--
  Airese · Verify email. A mobile-first web page at theairstation.com/airese/verify, opened in the phone's
  browser from the code in the email (public/email-code.html; flow in src/lib/emailCode.ts). The code
  comes filled in from the link; it can also be typed or pasted. Right code → "Email verified" → back to
  the app, on Your details, which now shows the email as verified.

  Query: ?email=<shown on the page>&code=<from the email link>&redirect=airese://details?verified=1
  Back to the app: opens the redirect link (verified), or the same link without ?verified=1 (change the email).
  Inside the browser preview (an iframe) it posts { source: 'airese-verify', result } to the app instead.

  Engineering: checking and resending the code are faked here (any code but 482913 is wrong).
  The server keeps the code for 10 minutes and allows 5 tries.
  A web page, not part of the app: light, with its own colours. Type and timings as in the app.
-->
<html lang="en">

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Confirm your email · Airese</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@400;600&display=swap" />
<style>
  /* A web page, not the app: light, with its own colours (text 7:1 or more on white). Type as in the app. */
  :root { --bg: #FFFFFF; --ink: #0B1020; --muted: #4A5266; --field: #F1F3F8; --accent: #2B4ACB; --error: #A1170F; --button: #0B1020; --on-button: #FFFFFF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 400 16px/24px Inter, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 440px; margin: 0 auto; padding: 40px 20px calc(32px + env(safe-area-inset-bottom)); }
  .logo { display: block; width: 56px; height: auto; color: var(--ink); margin-bottom: 40px; }
  h1 { margin: 0; font: 600 28px/36px Montserrat, system-ui, sans-serif; }
  p { margin: 0; }
  .lead { margin-top: 8px; color: var(--muted); }
  .lead b { color: var(--ink); font-weight: 600; word-break: break-all; }

  /* Six boxes over one real input, so paste and iOS code autofill fill all six at once */
  .code { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 32px; }
  .code input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; font-size: 16px; caret-color: transparent; }
  .box { height: 56px; border-radius: 12px; background: var(--field); border: 1.5px solid transparent;
    display: flex; align-items: center; justify-content: center; font: 600 24px/1 Montserrat, system-ui, sans-serif; }
  .code.focus .box.on { border-color: var(--accent); }
  .code.wrong .box { border-color: var(--error); }
  .error { display: flex; gap: 4px; align-items: flex-start; margin-top: 8px; font-size: 14px; line-height: 20px; color: var(--error); min-height: 20px; }
  .error svg { flex: none; width: 16px; height: 16px; margin-top: 2px; fill: var(--error); }
  .error:empty { visibility: hidden; }

  button { font: inherit; cursor: pointer; }
  .primary { display: block; width: 100%; height: 48px; margin-top: 24px; border: 0; border-radius: 999px; background: var(--button); color: var(--on-button);
    font: 400 16px/1 Montserrat, system-ui, sans-serif; }
  .link { min-height: 44px; padding: 0; border: 0; background: none; color: var(--accent); font: 400 16px/24px Inter, system-ui, sans-serif; }
  .link:disabled { color: var(--muted); cursor: default; }
  .more { display: flex; flex-direction: column; align-items: center; margin-top: 16px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .code:focus-within { outline: none; }

  .done { text-align: center; padding-top: 56px; }
  .done svg { width: 64px; height: 64px; fill: var(--accent); }
  .done h1 { margin-top: 16px; }
  [hidden] { display: none !important; }

  /* App timing (motion.ts fast: 500 ms, easeOut). Reduce Motion: no movement. */
  @media (prefers-reduced-motion: no-preference) {
    .box { transition: border-color 500ms cubic-bezier(0.2, 0, 0, 1); }
    .done { animation: arrive 500ms cubic-bezier(0.2, 0, 0, 1); }
    @keyframes arrive { from { opacity: 0; transform: translateY(12px); } }
  }
</style>
</head>

    <h1>Confirm your email</h1>
    <p class="lead">Enter the 6-digit code we sent to <b id="email">your email</b>.</p>

    <label class="code" id="code">
      <span class="box"></span><span class="box"></span><span class="box"></span><span class="box"></span><span class="box"></span><span class="box"></span>
      <input id="input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" aria-label="6-digit code" aria-describedby="error" />
    </label>
    <p class="error" id="error" role="alert"></p>

    <button class="primary" id="verify" type="button">Verify</button>
    <div class="more">
      <button class="link" id="resend" type="button" disabled>Resend code in 0:30</button>
      <button class="link" id="change" type="button">Wrong email? Change it</button>
    </div>
  </section>

    <p class="lead">Taking you back to Airese.</p>
    <button class="primary" id="back" type="button">Back to Airese</button>
  </section>
</main>
<script>
  (function () {
    var DEMO_CODE = '482913'; // prototype only; the server checks the real code
    var WAIT = 30; // seconds before Resend code
    var ERROR_ICON = '<svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M503.5-289.48q9.5-9.48 9.5-23.5t-9.48-23.52q-9.48-9.5-23.5-9.5t-23.52 9.48q-9.5 9.48-9.5 23.5t9.48 23.52q9.48 9.5 23.5 9.5t23.52-9.48ZM453-433h60v-253h-60v253Zm27.27 353q-82.74 0-155.5-31.5Q252-143 197.5-197.5t-86-127.34Q80-397.68 80-480.5t31.5-155.66Q143-709 197.5-763t127.34-85.5Q397.68-880 480.5-880t155.66 31.5Q709-817 763-763t85.5 127Q880-563 880-480.27q0 82.74-31.5 155.5Q817-252 763-197.68q-54 54.31-127 86Q563-80 480.27-80Zm.23-60Q622-140 721-239.5t99-241Q820-622 721.19-721T480-820q-141 0-240.5 98.81T140-480q0 141 99.5 240.5t241 99.5Zm-.5-340Z"/></svg>';

    var q = new URLSearchParams(location.search);
    var redirect = q.get('redirect') || 'airese://details?verified=1';
    if (q.get('email')) document.getElementById('email').textContent = q.get('email');

    var input = document.getElementById('input');
    var code = document.getElementById('code');
    var boxes = code.querySelectorAll('.box');
    var error = document.getElementById('error');
    var resend = document.getElementById('resend');

    function show(msg) { error.innerHTML = msg ? ERROR_ICON + '<span>' + msg + '</span>' : ''; code.classList.toggle('wrong', !!msg); }
    function draw() {
      var v = input.value;
      boxes.forEach(function (b, i) { b.textContent = v[i] || ''; b.classList.toggle('on', i === Math.min(v.length, 5)); });
    }

    input.addEventListener('input', function () {
      input.value = input.value.replace(/\D/g, '').slice(0, 6);
      show('');
      draw();
      if (input.value.length === 6) verify();
    });
    input.addEventListener('focus', function () { code.classList.add('focus'); });
    input.addEventListener('blur', function () { code.classList.remove('focus'); });

    function verify() {
      var v = input.value;
      if (v.length < 6) return show('Enter all 6 digits.');
      if (v !== DEMO_CODE) {
        show('That code doesn’t match. Check the email and try again.');
        input.select();
        return;
      }
      input.blur();
      document.getElementById('ask').hidden = true;
      document.getElementById('done').hidden = false;
      document.getElementById('doneTitle').focus();
      setTimeout(function () { back('verified'); }, 1200); // motion.slow duration
    }

    // Back to the app: a link it catches, or a message when the page sits in the preview's iframe
    var sent = false;
    function back(result) {
      if (sent) return;
      sent = true;
      if (window.parent !== window) window.parent.postMessage({ source: 'airese-verify', result: result }, '*');
      else location.href = result === 'verified' ? redirect : redirect.split('?')[0];
    }

    var left = WAIT, timer;
    function tick() {
      if (left > 0) {
        resend.disabled = true;
        resend.textContent = 'Resend code in 0:' + String(left).padStart(2, '0');
        left -= 1;
        timer = setTimeout(tick, 1000);
      } else {
        resend.disabled = false;
        resend.textContent = 'Resend code';
      }
    }
    resend.addEventListener('click', function () {
      // Engineering: ask the server for a new code
      input.value = ''; draw(); show('');
      left = WAIT; clearTimeout(timer); tick();
      input.focus();
    });

    document.getElementById('verify').addEventListener('click', verify);
    document.getElementById('change').addEventListener('click', function () { back('change-email'); });
    document.getElementById('back').addEventListener('click', function () { back('verified'); });

    // From the email link: the code comes filled in
    if (/^\d{6}$/.test(q.get('code') || '')) input.value = q.get('code');
    else input.focus();
    draw(); tick();
  })();
</script>
</body>
</html>
