<!doctype html>
<!--
  Airese · Email: your code. Sent when someone taps Verify in the email field on Your details (onboarding).
  The code is confirmed on the Airese page (public/verify-email.html).

  Template for the email service. Replace the sample values:
    {{code}}        482913 (in the subject, the preheader, the code box and the link)
    {{verify_url}}  https://theairstation.com/airese/verify?email={{email}}&code={{code}}
  The code box is a link to the Airese page with the code filled in; it confirms the email there and
  sends the person back to the app. Mail apps that offer "Copy code" work too.
  Subject: {{code}} is your Airese code
  (The code goes first in the subject so it shows in the notification, and iOS offers it as AutoFill.)

  Built for email clients: tables, inline styles, no scripts, web fonts with system fallbacks.
  Light, like most email: white, with Midnight text (7:1 or more). Type as in the app.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<meta name="supported-color-schemes" content="light" />
<title>482913 is your Airese code</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@600&display=swap" />
</head>
<body style="margin:0;padding:0;background:#FFFFFF;">
  <!-- Preheader: the line shown after the subject in the inbox -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Tap the code to confirm your email for Airese.</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FFFFFF;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
          <tr>
            <td style="padding-bottom:32px;">
              <img src="https://aud-nco.github.io/easmed/the-air-station/airese/design-system/img/icon.png" width="48" height="48" alt="Airese" style="display:block;border:0;border-radius:11px;" />
            </td>
          </tr>
          <tr>
            <td style="font-family:Montserrat,'Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;line-height:36px;font-weight:600;color:#0B1020;">
              Your Airese code
            </td>
          </tr>
          <tr>
            <td style="padding-top:8px;font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#4A5266;">
              Tap the code to confirm your email.
            </td>
          </tr>
          <tr>
            <td style="padding-top:24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="background:#F1F3F8;border-radius:16px;">
                    <a href="https://theairstation.com/airese/verify?code=482913" style="display:block;padding:24px 16px;font-family:Montserrat,'Segoe UI',Helvetica,Arial,sans-serif;font-size:40px;line-height:48px;font-weight:600;letter-spacing:10px;color:#0B1020;text-decoration:none;">482913</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding-top:16px;font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#4A5266;">
              It works for 10 minutes. If you didn’t ask for this code, you can ignore this email.
            </td>
          </tr>
          <tr><td style="height:40px;line-height:40px;font-size:0;">&nbsp;</td></tr>
          <tr>
            <td style="padding-top:24px;border-top:1px solid #E1E5EE;font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:20px;color:#4A5266;">
              Airese by Easmed · Powered by The Air Station
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
