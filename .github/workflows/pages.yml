# Builds the browser previews (iPhone frame, one self-contained HTML file each) and the
# shared design system page, and publishes them to GitHub Pages on every push to main.
#   /the-air-station/airese/v1/             pilot
#   /the-air-station/airese/v2/             full prototype
#   /the-air-station/airese/design-system/  shared by v1 and v2
name: Deploy prototypes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: The Air Station/Airese
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: The Air Station/Airese/package-lock.json
      - run: npm ci
      - run: npm run preview
      - name: Assemble site
        run: |
          mkdir -p ../../_site/the-air-station
          cp -R preview-dist ../../_site/the-air-station/airese
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=the-air-station/airese/v2/"><a href="the-air-station/airese/v2/">Airese</a>\n' > ../../_site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
